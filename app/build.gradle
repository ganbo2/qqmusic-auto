plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ganbo2.qqmusicauto'
    compileSdk 34

    // 读取版本号属性文件（由 GitHub Actions 动态生成）
    def versionProps = new Properties()
    def versionFile = rootProject.file('version.properties')
    if (versionFile.exists()) {
        versionFile.withInputStream { versionProps.load(it) }
    }
    def verCode = versionProps.getProperty('versionCode', '1').toInteger()
    def verName = versionProps.getProperty('versionName', '1.0')

    defaultConfig {
        applicationId "com.ganbo2.qqmusicauto"
        minSdk 24
        targetSdk 34
        versionCode verCode
        versionName verName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
}

// 强制 Kotlin 标准库版本对齐，避免 duplicate class 错误
// （androidx 传递依赖了旧的 kotlin-stdlib-jdk7/jdk8:1.6.21，与 AGP 自带的 1.8.22 冲突）
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
