name: Build QQMusicAuto APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          # versionCode 用「构建时间分钟数」保证每次构建严格递增，覆盖安装不会失败；
          # 若担心回退，可叠加提交数。这里取两者较大者作为单调递增的版本码。
          BUILD_TS=$(date -u +%s)
          VERSION_CODE=$((BUILD_TS / 60 + COMMIT_COUNT * 100000))
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          # 写入版本号属性文件（versionCode 每次构建严格递增，保证覆盖安装成功）
          printf 'versionCode=%d\nversionName=1.%d.%s\n' "$VERSION_CODE" "$COMMIT_COUNT" "$SHORT_SHA" > "$GITHUB_WORKSPACE/version.properties"
          echo "versionCode=$VERSION_CODE, versionName=1.$COMMIT_COUNT.$SHORT_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (official cmdline-tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d $HOME
          echo "GRADLE_HOME=$HOME/gradle-8.2" >> $GITHUB_ENV
          echo "$HOME/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          gradle assembleDebug > /tmp/gradle-build.log 2>&1 || RC=$?
          cat /tmp/gradle-build.log
          if [ "${RC:-0}" -ne 0 ]; then
            grep -nE "error:|FAILURE:|What went wrong|Execution failed|Could not|Caused by:|symbol:|location:" /tmp/gradle-build.log \
              | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit $RC
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log

      - name: Verify APK signing identity
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qqmusic-auto-debug
          path: app/build/outputs/apk/debug/*.apk
